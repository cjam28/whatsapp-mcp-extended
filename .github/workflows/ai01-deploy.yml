name: AI01 build & deploy

# Push to `ai01` → build ghcr.io/cjam28/whatsapp-bridge and whatsapp-mcp (linux/amd64),
# tagged :ai01 and :sha-<rev>, then POST the Portainer webhook for stack `whatsapp-mcp`
# (AI01, endpoint 4). The stack force-pulls on redeploy. Portainer can't build on AI01
# (BuildKit "frame too large"), and its git polling is unreliable, hence this workflow.
# Secret: AI01_WHATSAPP_STACK_WEBHOOK (full webhook URL).

on:
  push:
    branches: [ai01]
  workflow_dispatch:

concurrency:
  group: ai01-deploy
  cancel-in-progress: false

jobs:
  test:
    if: github.repository == 'cjam28/whatsapp-mcp-extended'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: whatsapp-bridge/go.mod
      - name: Bridge build, vet, test
        working-directory: whatsapp-bridge
        run: |
          test -z "$(gofmt -l internal)" || { gofmt -l internal; exit 1; }
          go build ./...
          go vet ./internal/api ./internal/whatsapp
          go test ./...
      - uses: astral-sh/setup-uv@v6
      - name: MCP server tests
        working-directory: whatsapp-mcp-server
        env:
          WA_SKIP_DB_CHECK: "1"
        run: uv run -q pytest -q

  build:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: whatsapp-bridge
            dockerfile: Dockerfile.bridge
          - name: whatsapp-mcp
            dockerfile: Dockerfile.mcp
          - name: whatsapp-qr-page
            dockerfile: deploy/ai01/qr-page/Dockerfile
            context: deploy/ai01/qr-page
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/cjam28/${{ matrix.name }}:ai01
            ghcr.io/cjam28/${{ matrix.name }}:sha-${{ steps.meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Trigger Portainer stack webhook
        env:
          WEBHOOK: ${{ secrets.AI01_WHATSAPP_STACK_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "::error::AI01_WHATSAPP_STACK_WEBHOOK not set"; exit 1; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST --max-time 120 "$WEBHOOK")
          echo "webhook HTTP $code"
          case "$code" in 2*) ;; *) echo "::error::webhook returned $code"; exit 1;; esac
